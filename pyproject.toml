[project] 
name = "pi-server" 
version = "0.1.0" 
description = "Arduino sensor → ML classifier → Home Assistant" 
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"pydantic",
	"httpx",
	"pyserial",
	"scikit-learn",
	"joblib",
	"numpy",
	"pandas",
]

[dependency-groups]
dev = [
    "ruff >= 0.8.1",
    "matplotlib",
    "seaborn",
    "jupyter",
]
