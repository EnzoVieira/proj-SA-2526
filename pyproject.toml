[project] 
name = "pi-server" 
version = "0.1.0" 
description = "Arduino sensor → ML classifier → Home Assistant" 
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"pydantic",
	"httpx",
	"python-dotenv",
	"pyserial",
	"scikit-learn",
	"joblib",
	"numpy",
	"pandas",
	"matplotlib>=3.10.9",
	"seaborn>=0.13.2",
	"jupyter>=1.1.1",
	"ruff>=0.15.12",
]

[dependency-groups]
dev = [
    "ruff >= 0.8.1",
    "matplotlib",
    "seaborn",
    "jupyter",
]
